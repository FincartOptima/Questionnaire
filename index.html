<style>
/* ============================================================
   DESIGN TOKENS — light, brand-blue, drafting-grid structure.
   Blue sampled from the Fincart mark: rgb(21,81,253).
   ============================================================ */
:root{
  --brand:#1551FD;
  --brand-dk:#0F3CBF;
  --brand-tint:#ECF1FF;
  --brand-tint-2:#DCE6FF;

  --ink:#111721;
  --ink-2:#2A3342;
  --muted:#65707F;
  --faint:#8C97A5;

  --paper:#F6F7F9;
  --card:#FFFFFF;
  --rule:#E3E7ED;
  --rule-2:#EDF0F4;
  --danger:#C0392B;
  --shadow:0 1px 2px rgba(17,23,33,.04), 0 8px 28px rgba(17,23,33,.06);

  --f-display:"Archivo",system-ui,-apple-system,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;

  --pad:clamp(20px,5vw,56px);
  --maxw:720px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-body);background:var(--paper);color:var(--ink);
  line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100dvh;
}
button,input,label{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:3px}

/* ---------- shell ---------- */
.shell{min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}

.masthead{background:var(--card);border-bottom:1px solid var(--rule)}
.masthead .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:15px;padding-bottom:15px}
.logo{height:26px;width:auto;display:block}
.masthead .kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);white-space:nowrap}

.stage{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(18px,5.5vw,56px) 0}
@media (min-width:640px){.stage{justify-content:center}}

.colophon{border-top:1px solid var(--rule);background:var(--card)}
.colophon .wrap{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;padding-top:15px;padding-bottom:15px}

/* ---------- type ---------- */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--brand);margin:0 0 14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5.8vw,45px);line-height:1.08;letter-spacing:-.022em;margin:0 0 16px}
h2{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,3.4vw,27px);line-height:1.26;letter-spacing:-.012em;margin:0 0 22px;max-width:34ch}
.lede{font-size:clamp(15px,2vw,16.5px);color:var(--muted);max-width:52ch;margin:0 0 30px}
.fineprint{font-size:12.5px;color:var(--faint);line-height:1.5}

/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);padding:clamp(22px,4.2vw,34px)}

/* ---------- form ---------- */
.field{margin-bottom:17px}
.field label{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field label .opt-tag{color:var(--faint);letter-spacing:.08em}
.control{
  width:100%;padding:12px 13px;background:var(--card);color:var(--ink);
  border:1px solid var(--rule);border-radius:6px;font-size:16px;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
}
.control::placeholder{color:#AEB6C1}
.control:hover{border-color:#CBD2DB}
.control:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,81,253,.13)}
.control[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px rgba(192,57,43,.1)}
.phone-row{display:flex;align-items:stretch}
.phone-row .prefix{
  display:flex;align-items:center;padding:0 12px;font-family:var(--f-mono);font-size:14px;color:var(--muted);
  background:var(--paper);border:1px solid var(--rule);border-right:0;border-radius:6px 0 0 6px;
}
.phone-row .control{border-radius:0 6px 6px 0}
.err{display:block;min-height:16px;margin-top:5px;font-size:12.5px;color:var(--danger)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

.consent{display:flex;gap:10px;align-items:flex-start;margin:20px 0 4px;cursor:pointer}
.consent input{margin:2px 0 0;width:16px;height:16px;flex:0 0 auto;accent-color:var(--brand)}
.consent span{font-size:13px;color:var(--muted);line-height:1.5}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--f-display);font-weight:600;font-size:15px;
  padding:13px 24px;border-radius:6px;background:var(--brand);color:#fff;
  transition:background .16s var(--ease),transform .1s var(--ease);
}
.btn:hover{background:var(--brand-dk)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .arw{font-family:var(--f-mono);font-size:14px}
.btn-ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--rule);padding:12px 18px;font-size:14px}
.btn-ghost:hover{background:var(--paper);border-color:#CBD2DB}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}

/* ---------- progress ---------- */
.progress{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.ticks{display:flex;gap:5px;flex:1}
.tick{height:3px;flex:1;background:var(--rule);border-radius:2px;transition:background .35s var(--ease)}
.tick.done{background:var(--brand)}
.tick.now{background:var(--brand-tint-2)}
.counter{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);white-space:nowrap}

/* ---------- options ---------- */
.opts{display:grid;gap:8px;margin:0;padding:0;border:0}
.opt{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-radius:6px;
  transition:border-color .14s var(--ease),background .14s var(--ease),box-shadow .14s var(--ease),transform .1s var(--ease);
}
.opt:hover{border-color:#B9C6E8;background:#FCFDFF}
.opt:active{transform:translateY(1px)}
.opt.sel{border-color:var(--brand);background:var(--brand-tint);box-shadow:inset 0 0 0 1px var(--brand)}
.opt .key{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--faint);padding-top:2px;flex:0 0 auto}
.opt.sel .key{color:var(--brand)}
.opt .txt{font-size:15px;line-height:1.47;color:var(--ink-2)}
.opt.sel .txt{color:var(--ink)}

/* ---------- SIGNATURE: structure diagram ---------- */
.diagram{margin:0}
.structure{display:flex;gap:clamp(6px,2.2vw,14px);align-items:flex-end;margin:0 0 9px}
.col{flex:1;display:flex;flex-direction:column-reverse;gap:4px}
.seg{
  height:clamp(11px,2.6vw,17px);border:1px solid var(--rule-2);border-radius:2px;background:var(--paper);
  transition:background .38s var(--ease),border-color .38s var(--ease);
}
.seg.on{background:var(--brand);border-color:var(--brand)}
.axis{display:flex;gap:clamp(6px,2.2vw,14px);border-top:1px solid var(--rule);padding-top:8px}
.axis span{
  flex:1;display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.axis span b{display:block;font-weight:500;font-size:11.5px;letter-spacing:.02em;color:var(--ink-2);margin-top:3px}

/* ---------- result ---------- */
.score{font-family:var(--f-display);font-weight:700;font-size:clamp(48px,11vw,76px);line-height:.9;letter-spacing:-.04em;color:var(--brand);margin:0}
.score .of{font-family:var(--f-mono);font-size:14px;font-weight:400;letter-spacing:.06em;color:var(--faint);margin-left:9px;vertical-align:super}
.band{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,4.2vw,30px);letter-spacing:-.012em;margin:18px 0 8px}
.band-note{font-size:clamp(15px,2.1vw,16.5px);color:var(--muted);max-width:46ch;margin:0 0 28px}

/* ---------- save status ---------- */
.submitStatus{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted);padding:13px 4px}
.submitStatus .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.submitStatus[data-state="saving"] .dot{background:#C98A1E;animation:pulse 1.1s infinite}
.submitStatus[data-state="saved"]{color:#2E9E6B}
.submitStatus[data-state="saved"] .dot{background:#2E9E6B}
.submitStatus[data-state="failed"]{color:var(--danger)}
.submitStatus[data-state="failed"] .dot{background:var(--danger)}
.submitStatus[data-state="off"]{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- motion ---------- */
.enter{animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ---------- fatal ---------- */
.fatal{border:1px solid var(--danger);border-left-width:3px;border-radius:6px;padding:20px 22px;background:var(--card)}
.fatal h2{color:var(--danger);font-size:19px;margin-bottom:10px}
.fatal code{font-family:var(--f-mono);font-size:12px;background:var(--paper);padding:2px 5px;border-radius:3px}

@media (max-width:520px){
  .axis span{font-size:8px;letter-spacing:0}
  .opt{padding:13px 14px;gap:11px}
  .opt .txt{font-size:14.5px}
  .logo{height:22px}
  .masthead .kicker{display:none}
  .actions .btn{flex:1 1 auto}
  h1{margin-bottom:12px}
  .lede{margin-bottom:22px}
  .card{padding:20px 18px}
  .field{margin-bottom:14px}
}
</style>
</head>

"use strict";
/* ============================================================================
 * FINCART — WEALTH SYSTEMS AUDIT
 * Single-file client. No build step, no dependencies, no browser storage.
 *
 * ARCHITECTURE
 *   CONFIG      — every tunable value; nothing is hardcoded below this block.
 *   QUESTIONS   — content, verbatim from the source workbook.
 *   BANDS       — score→result mapping, validated at boot.
 *   Pure fns    — validation + scoring, side-effect free and unit-testable.
 *   Transport   — Google Sheets POST with timeout, retry and backoff.
 *   Controller  — explicit state machine: gate → q0..q4 → result.
 * ========================================================================== */

/* ------------------------------------------------------------------ CONFIG */
/**

 * @property {number}  requestTimeoutMs
 * @property {number}  maxRetries
 * @property {number}  minGateSeconds    Bot heuristic: a valid form faster than this is rejected.
 */
/** @type {Readonly<AppConfig>} */
const CONFIG = Object.freeze({
  // ▼▼▼ PASTE THE APPS SCRIPT WEB APP /exec URL HERE ▼▼▼
  // It looks like: https://script.google.com/macros/s/AKfycb.../exec
  // It is NOT the docs.google.com/spreadsheets/... link.

/* --------------------------------------------------------------- QUESTIONS */
/**
 * @typedef {Object} Option
 * @property {"A"|"B"|"C"|"D"} key
 * @property {string} text
 * @property {number} score
 *
 * @typedef {Object} Question
 * @property {string} id
 * @property {string} dimension
 * @property {string} prompt
 * @property {ReadonlyArray<Option>} options
 */
/** @type {ReadonlyArray<Question>} */
const QUESTIONS = Object.freeze([
  {
    id: "q1", dimension: "Clarity",
    prompt: "If your family needed to locate every asset you own today \u2014 investments, properties, business stakes, insurance \u2014 how confident are you they could do it without your help?",
    options: [
      { key:"A", score:4, text:"Very confident. Every asset is documented in one place they can access." },
      { key:"B", score:3, text:"Mostly \u2014 they\u2019d find the significant assets, but miss the smaller ones." },
      { key:"C", score:2, text:"Probably not. It\u2019s spread across accounts and lives largely in my head." },
      { key:"D", score:1, text:"I haven\u2019t considered this until now." }

  },
  {
    id: "q2", dimension: "Control",
    prompt: "If your business went through a severe downturn or dispute tomorrow, how protected is your personal wealth?",
    options: [
      { key:"A", score:4, text:"Completely ring-fenced. My personal assets are structurally independent of the business." },
      { key:"B", score:3, text:"Mostly separated, with some overlap I\u2019m aware of and comfortable with." },
      { key:"C", score:2, text:"Partially exposed \u2014 a bad business year would hurt my personal wealth too." },
      { key:"D", score:1, text:"I honestly don\u2019t know where one ends and the other begins." }
    ]
  },
  {
    id: "q3", dimension: "Coordination",
    prompt: "Your CA, wealth manager, and lawyers \u2014 do they function as one coordinated team, or in separate silos?",
    options: [
      { key:"A", score:4, text:"One advisor coordinates all of them. Nothing falls through the cracks." },
      { key:"B", score:3, text:"I coordinate them myself, but it takes significant time and attention." },
      { key:"C", score:2, text:"They work independently. I\u2019m not sure they\u2019re even aware of each other." },
      { key:"D", score:1, text:"I handle most of it personally. There\u2019s no real team structure." }
    ]
  },
  {
    id: "q4", dimension: "Continuity",
    prompt: "Is there a formal, documented plan for how your wealth continues to operate if you are unavailable for six months?",
    options: [
      { key:"A", score:4, text:"Yes \u2014 documented, signed, and my family knows exactly where to find it." },
      { key:"B", score:3, text:"I\u2019ve drafted something, but it\u2019s not fully formalised or communicated." },
      { key:"C", score:2, text:"It exists in my head. My family would figure it out." },
      { key:"D", score:1, text:"There is no such plan." }
    ]
  },
  {
    id: "q5", dimension: "Legacy",
    prompt: "Have you decided \u2014 in writing \u2014 how your wealth transitions to the next generation, not just legally, but by intent and values?",
    options: [
      { key:"A", score:4, text:"Yes. The legal structure, the intent behind it, and the values are all documented." },
      { key:"B", score:3, text:"The legal structure is in place, but the intent and values have not been written down." },
      { key:"C", score:2, text:"We\u2019ve discussed it as a family, but nothing has been formalised." },
      { key:"D", score:1, text:"This hasn\u2019t been addressed yet." }
    ]

/* -------------------------------------------------------------------- BANDS
 * SOURCE DEFECT (corrected — see README):
 *   The workbook lists "Score: 8-12" twice (Exposed AND Uncharted) and leaves
 *   5-7 unmapped. 5 questions x 1..4 = a 5..20 range, so the only tiling
 *   consistent with the other bands is 5-7 / 8-12 / 13-17 / 18-20.
 *   assertBandIntegrity() enforces that invariant at boot.
 * ------------------------------------------------------------------------ */
/**
 * @typedef {Object} Band
 * @property {number} min
 * @property {number} max
 * @property {string} title
 * @property {string} note
 */
/** @type {ReadonlyArray<Band>} */
const BANDS = Object.freeze([
  { min:18, max:20, title:"Well-Architected",
    note:"Strong foundations. Now let\u2019s find out what\u2019s left." },
  { min:13, max:17, title:"Partially Structured",
    note:"Gaps without coordinated systems leave room for discord." },
  { min:8,  max:12, title:"Exposed",
    note:"Your business runs on systems. Your wealth runs on instinct." },
  { min:5,  max:7,  title:"Uncharted",
    note:"You built the empire. No map of it exists yet." }
]);

/* ------------------------------------------------------------ PURE HELPERS */

/** Lowest and highest attainable totals, derived — never hardcoded. */
function scoreRange() {
  let lo = 0, hi = 0;
  for (const q of QUESTIONS) {
    const scores = q.options.map(o => o.score);
    lo += Math.min(...scores);
    hi += Math.max(...scores);
  }
  return { lo, hi };
}

/**
 * Boot-time invariant check. Throws if BANDS do not tile [lo,hi] exactly.
 * This is the guard that would have caught the duplicated 8-12 band.
 * @returns {void}
 */
function assertBandIntegrity() {
  const { lo, hi } = scoreRange();
  if (!Array.isArray(BANDS) || BANDS.length === 0) throw new Error("BANDS is empty.");

  for (const b of BANDS) {
    if (!Number.isInteger(b.min) || !Number.isInteger(b.max)) throw new Error(`Band "${b.title}" has non-integer bounds.`);
    if (b.min > b.max) throw new Error(`Band "${b.title}" has min > max (${b.min} > ${b.max}).`);
    if (!b.title || !b.note) throw new Error(`Band "${b.title || "(untitled)"}" is missing title or note.`);
  }

  const seen = new Map();
  for (const b of BANDS) {
    for (let s = b.min; s <= b.max; s++) {
      if (seen.has(s)) throw new Error(`Score ${s} maps to two bands: "${seen.get(s)}" and "${b.title}".`);
      seen.set(s, b.title);
    }
  }
  const gaps = [];
  for (let s = lo; s <= hi; s++) if (!seen.has(s)) gaps.push(s);
  if (gaps.length) throw new Error(`No band covers score(s): ${gaps.join(", ")}. Valid range is ${lo}\u2013${hi}.`);

  for (const [s, t] of seen) {
    if (s < lo || s > hi) throw new Error(`Band "${t}" covers score ${s}, outside the attainable range ${lo}\u2013${hi}.`);
  }
}

/** @param {number} total @returns {Band} */
function resolveBand(total) {
  const band = BANDS.find(b => total >= b.min && total <= b.max);
  if (!band) throw new Error(`Unmappable score: ${total}.`); // unreachable once assertBandIntegrity passes
  return band;
}

/**
 * @param {Record<string,Option>} answers keyed by question id
 * @returns {{total:number, complete:boolean, missing:string[]}}
 */
function computeScore(answers) {
  const missing = [];
  let total = 0;
  for (const q of QUESTIONS) {
    const a = answers[q.id];
    if (!a || typeof a.score !== "number" || !Number.isFinite(a.score)) { missing.push(q.id); continue; }
    total += a.score;
  }
  return { total, complete: missing.length === 0, missing };
}

/**
 * @param {string} raw
 * @returns {{ok:true,value:string}|{ok:false,error:string}}
 */
function validateName(raw) {
  const v = String(raw == null ? "" : raw).trim().replace(/\s{2,}/g, " ");
  if (v.length === 0) return { ok:false, error:"Enter your name." };
  if (v.length < 2)   return { ok:false, error:"That\u2019s too short to be a name." };
  if (v.length > 60)  return { ok:false, error:"Keep it under 60 characters." };
  if (/\d/.test(v))   return { ok:false, error:"A name shouldn\u2019t contain numbers." };
  if (!/^[\p{L}][\p{L}\p{M}'.\- ]*$/u.test(v)) return { ok:false, error:"Use letters, spaces, hyphens and apostrophes only." };
  return { ok:true, value:v };
}

/**
 * Pragmatic email check. Deliberately NOT RFC 5322 — that regex accepts
 * addresses no mail server will deliver to and rejects nothing useful.
 * This catches the mistakes people actually make.
 * @param {string} raw
 * @param {boolean} required
 * @returns {{ok:true,value:string}|{ok:false,error:string}}
 */
function validateEmail(raw, required) {
  const v = String(raw == null ? "" : raw).trim().toLowerCase();
  if (v.length === 0) {
    return required ? { ok:false, error:"Enter your email address." } : { ok:true, value:"" };
  }
  if (v.length > 254) return { ok:false, error:"That address is too long." };
  if (/\s/.test(v)) return { ok:false, error:"An email address can\u2019t contain spaces." };
  const at = v.split("@");
  if (at.length !== 2) return { ok:false, error:"Include exactly one @ sign." };
  const [local, domain] = at;
  if (local.length === 0 || local.length > 64) return { ok:false, error:"Check the part before the @." };
  if (!/^[a-z0-9!#$%&'*+/=?^_`{|}~.-]+$/.test(local)) return { ok:false, error:"Check the part before the @." };
  if (local.startsWith(".") || local.endsWith(".") || local.includes("..")) return { ok:false, error:"Check the part before the @." };
  if (!/^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/.test(domain)) {
    return { ok:false, error:"Check the domain after the @." };
  }
  const tld = domain.slice(domain.lastIndexOf(".") + 1);
  if (tld.length < 2 || /\d/.test(tld)) return { ok:false, error:"Check the domain after the @." };
  return { ok:true, value:v };
}

/**
 * Normalises an Indian mobile number to 10 digits. Accepts +91, 0091, 91 and
 * leading-0 forms, plus spaces, hyphens, dots and parentheses.
 * @param {string} raw
 * @returns {{ok:true,value:string}|{ok:false,error:string}}
 */
function normaliseMobile(raw) {
  let d = String(raw == null ? "" : raw).replace(/[\s\-().]/g, "");
  if (d.length === 0) return { ok:false, error:"Enter your mobile number." };
  if (/[^\d+]/.test(d)) return { ok:false, error:"Digits only." };
  d = d.replace(/^\+/, "");
  if (d.length === 14 && d.startsWith("0091")) d = d.slice(4);
  else if (d.length === 12 && d.startsWith("91")) d = d.slice(2);
  else if (d.length === 11 && d.startsWith("0"))  d = d.slice(1);
  if (!/^\d{10}$/.test(d)) return { ok:false, error:"An Indian mobile number is 10 digits." };
  if (!/^[6-9]/.test(d))   return { ok:false, error:"Mobile numbers start with 6, 7, 8 or 9." };
  if (/^(\d)\1{9}$/.test(d)) return { ok:false, error:"That doesn\u2019t look like a real number." };
  return { ok:true, value:d };
}

/** RFC4122-ish id with a fallback for non-secure contexts. */
function newSessionId() {
  try {
    if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") return crypto.randomUUID();
    if (typeof crypto !== "undefined" && crypto.getRandomValues) {
      const b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
      const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
      return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
    }
  } catch (_) { /* fall through */ }
  return `fb-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------------------------------------------------------- TRANSPORT
 * Apps Script /exec accepts a simple POST. Content-Type is text/plain so the
 * browser sends no CORS preflight (Apps Script cannot answer OPTIONS).
 * ------------------------------------------------------------------------ */

/**
 * @param {Record<string,unknown>} payload
 * @returns {Promise<{ok:boolean,status:string,detail?:string}>}
 */
async function postToSheet(payload) {
  if (!CONFIG.endpoint) return { ok:false, status:"offline", detail:"No endpoint configured." };

  const body = JSON.stringify({ ...payload, secret: CONFIG.sharedSecret });
  let lastErr = "unknown";

  for (let attempt = 0; attempt <= CONFIG.maxRetries; attempt++) {
    if (attempt > 0) await sleep(Math.min(500 * 2 ** (attempt - 1), 4000) + Math.random() * 250);

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.requestTimeoutMs);
    try {
      const res = await fetch(CONFIG.endpoint, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body,
        redirect: "follow",
        signal: ctrl.signal
      });
      clearTimeout(timer);
      if (!res.ok) { lastErr = `HTTP ${res.status}`; continue; }
      const text = await res.text();
      let json = null;
      try { json = JSON.parse(text); } catch (_) { /* Apps Script returns HTML on some errors */ }
      if (json && json.ok === true) return { ok:true, status:"saved" };

      const errMsg = (json && json.error) ? String(json.error) : "Unexpected response from the sheet.";
      lastErr = errMsg;
      // A clean response the server understood and rejected (bad secret, bad
      // payload) will reject identically on every retry — retrying just delays
      // the user's feedback and burns Apps Script's daily request quota for
      // nothing. Only "busy" (lock contention) is genuinely transient.
      if (!/busy/i.test(errMsg)) return { ok:false, status:"failed", detail:errMsg };
    } catch (err) {
      clearTimeout(timer);
      lastErr = (err && err.name === "AbortError") ? "Request timed out." : "Network unavailable.";
    }
  }
  return { ok:false, status:"failed", detail:lastErr };
}

/* --------------------------------------------------------------- CONTROLLER */

const state = {
  sessionId: newSessionId(),
  name: "", email: "", mobile: "", consent: false,
  answers: Object.create(null),
  index: 0,
  step: "q0",
  gateShownAt: Date.now()
};

const $stage = document.getElementById("stage");

/** Escape untrusted values before they touch innerHTML. */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function structureMarkup() {
  const maxPerQ = Math.max(...QUESTIONS[0].options.map(o => o.score));
  const rows = QUESTIONS.map(q => {
    const a = state.answers[q.id];
    const filled = a ? a.score : 0;
    const segs = [1,2,3,4].map(n => `<div class="seg${n <= filled ? " on" : ""}"></div>`).join("");
    return `<div class="col" role="img" aria-label="${esc(q.dimension)}: ${filled} of ${maxPerQ}">${segs}</div>`;
  }).join("");
  const labels = QUESTIONS.map(q => {
    const a = state.answers[q.id];
    return `<span>${esc(q.dimension)}<b>${a ? `${a.score}/${maxPerQ}` : "\u2014"}</b></span>`;
  }).join("");
  return `<div class="diagram"><div class="structure">${rows}</div><div class="axis">${labels}</div></div>`;
}

/* ---- screen: gate ---- */
function renderGate() {
  state.step = "gate";
  state.gateShownAt = Date.now();
  document.getElementById("colophonLeft").textContent = "One last step";

  const emailTag = CONFIG.emailRequired ? "" : ` <span class="opt-tag">(optional)</span>`;

  $stage.innerHTML = `
    <div class="wrap enter">
      <p class="eyebrow">One last step</p>
      <h1>Your result is ready.</h1>
      <p class="lede">Enter your details below and we\u2019ll show your score immediately.</p>

      <div class="card">
        <div class="field">
          <label for="fName">Your name</label>
          <input class="control" id="fName" type="text" autocomplete="name" inputmode="text"
                 maxlength="60" placeholder="e.g. Rajneesh Sharma" aria-describedby="eName">
          <span class="err" id="eName" role="alert"></span>
        </div>

        <div class="field">
          <label for="fEmail">Email address${emailTag}</label>
          <input class="control" id="fEmail" type="email" autocomplete="email" inputmode="email"
                 maxlength="254" placeholder="name@company.com" aria-describedby="eEmail">
          <span class="err" id="eEmail" role="alert"></span>
        </div>

        <div class="field">
          <label for="fMobile">Mobile number</label>
          <div class="phone-row">
            <span class="prefix" aria-hidden="true">+91</span>
            <input class="control" id="fMobile" type="tel" autocomplete="tel-national" inputmode="numeric"
                   maxlength="15" placeholder="98765 43210" aria-describedby="eMobile">
          </div>
          <span class="err" id="eMobile" role="alert"></span>
        </div>

        <input class="hp" id="fWebsite" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" placeholder="Leave blank">

        <label class="consent" for="fConsent">
          <input type="checkbox" id="fConsent">
          <span>I agree to ${esc(CONFIG.brandName)} contacting me about this questionnaire on the details above.${
            CONFIG.privacyUrl ? ` <a href="${esc(CONFIG.privacyUrl)}" target="_blank" rel="noopener">Privacy notice</a>.` : ""
          }</span>
        </label>
        <span class="err" id="eConsent" role="alert"></span>

        <div class="actions">
          <button class="btn" id="btnStart" type="button">Show my result <span class="arw" aria-hidden="true">&rarr;</span></button>
        </div>
      </div>

      <p class="fineprint" style="margin-top:18px">We use your details to send your result and follow up once. Nothing else.</p>
    </div>`;

  const nameEl = document.getElementById("fName");
  const mailEl = document.getElementById("fEmail");
  const mobEl  = document.getElementById("fMobile");

  nameEl.addEventListener("input", () => clearErr(nameEl, "eName"));
  mailEl.addEventListener("input", () => clearErr(mailEl, "eEmail"));
  mobEl.addEventListener("input",  () => clearErr(mobEl,  "eMobile"));
  nameEl.addEventListener("keydown", e => { if (e.key === "Enter") mailEl.focus(); });
  mailEl.addEventListener("keydown", e => { if (e.key === "Enter") mobEl.focus(); });
  mobEl.addEventListener("keydown",  e => { if (e.key === "Enter") submitGate(); });
  document.getElementById("btnStart").addEventListener("click", submitGate);
  document.getElementById("fConsent").addEventListener("change", () => { document.getElementById("eConsent").textContent = ""; });
  nameEl.focus({ preventScroll:true });
}

function clearErr(input, errId) {
  input.removeAttribute("aria-invalid");
  const e = document.getElementById(errId);
  if (e) e.textContent = "";
}
function showErr(input, errId, msg) {
  input.setAttribute("aria-invalid", "true");
  const e = document.getElementById(errId);
  if (e) e.textContent = msg;
}

function submitGate() {
  const nameEl = document.getElementById("fName");
  const mailEl = document.getElementById("fEmail");
  const mobEl  = document.getElementById("fMobile");
  const conEl  = document.getElementById("fConsent");
  const hpEl   = document.getElementById("fWebsite");

  // 1. Honeypot — a hidden field only an automated filler would touch.
  if (hpEl.value.trim() !== "") {
    showErr(mobEl, "eMobile", "Something went wrong. Please try again in a moment.");
    state.gateShownAt = Date.now();
    return;
  }

  // 2. Field validation, BEFORE the timing heuristic, so a real person who
  //    clicks quickly on an empty form gets a useful message not a bot warning.
  const n = validateName(nameEl.value);
  const e = validateEmail(mailEl.value, CONFIG.emailRequired);
  const m = normaliseMobile(mobEl.value);
  let bad = false;
  if (!n.ok) { showErr(nameEl, "eName",  n.error); bad = true; }
  if (!e.ok) { showErr(mailEl, "eEmail", e.error); bad = true; }
  if (!m.ok) { showErr(mobEl,  "eMobile", m.error); bad = true; }
  if (!conEl.checked) { document.getElementById("eConsent").textContent = "Please tick the box so we can send your result."; bad = true; }
  if (bad) { (!n.ok ? nameEl : !e.ok ? mailEl : mobEl).focus(); return; }

  // 3. Timing heuristic — only a correctly filled form submitted implausibly
  //    fast looks scripted. Give the user their two seconds back and move on.
  if ((Date.now() - state.gateShownAt) < CONFIG.minGateSeconds * 1000) {
    showErr(mobEl, "eMobile", "Just a moment \u2014 please try again.");
    state.gateShownAt = Date.now();
    return;
  }

  state.name = n.value;
  state.email = e.value;
  state.mobile = m.value;
  state.consent = true;

  // Fire-and-forget partial capture: if the "complete" save below fails or the
  // tab closes before it resolves, we still have their contact details.
  void postToSheet({
    stage: "lead",
    sessionId: state.sessionId,
    name: state.name,
    email: state.email,
    mobile: state.mobile,
    consent: true,
    source: (typeof location !== "undefined" ? location.hostname : "") || "unknown",
    clientTime: new Date().toISOString()
  });

  renderResult();
}

/* ---- screen: question ---- */
function renderQuestion() {
  state.step = `q${state.index}`;
  const q = QUESTIONS[state.index];
  const n = state.index + 1;
  const total = QUESTIONS.length;
  document.getElementById("colophonLeft").textContent = `Question ${n} of ${total}`;

  const ticks = QUESTIONS.map((_, i) =>
    `<div class="tick${i < state.index ? " done" : i === state.index ? " now" : ""}"></div>`).join("");

  const selected = state.answers[q.id];
  const opts = q.options.map(o => `
    <button class="opt${selected && selected.key === o.key ? " sel" : ""}" type="button"
            data-key="${o.key}" aria-pressed="${selected && selected.key === o.key ? "true" : "false"}">
      <span class="key" aria-hidden="true">${o.key}</span>
      <span class="txt">${esc(o.text)}</span>
    </button>`).join("");

  $stage.innerHTML = `
    <div class="wrap enter">
      <div class="progress">
        <div class="ticks">${ticks}</div>
        <div class="counter">${String(n).padStart(2,"0")} / ${String(total).padStart(2,"0")}</div>
      </div>
      <div class="card">
        <p class="eyebrow">${esc(q.dimension)}</p>
        <h2>${esc(q.prompt)}</h2>
        <div class="opts" role="group" aria-label="${esc(q.dimension)} options">${opts}</div>
        ${state.index > 0 ? `<div class="actions"><button class="btn-ghost btn" id="btnBack" type="button">&larr; Back</button></div>` : ""}
      </div>
    </div>`;

  $stage.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => choose(q, btn.dataset.key)));
  const back = document.getElementById("btnBack");
  if (back) back.addEventListener("click", () => { state.index--; renderQuestion(); });
}

/** @param {Question} q @param {string} key */
function choose(q, key) {
  const opt = q.options.find(o => o.key === key);
  if (!opt) return; // defensive: unknown key from a tampered DOM
  state.answers[q.id] = opt;

  $stage.querySelectorAll(".opt").forEach(b => {
    const on = b.dataset.key === key;
    b.classList.toggle("sel", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  setTimeout(() => {
    if (state.index < QUESTIONS.length - 1) { state.index++; renderQuestion(); }
    else renderGate();
  }, 250);
}

/* ---- screen: result ---- */
async function renderResult() {
  state.step = "result";
  const { total, complete, missing } = computeScore(state.answers);

  if (!complete) { // defensive: unreachable via the UI
    state.index = QUESTIONS.findIndex(q => q.id === missing[0]);
    renderQuestion();
    return;
  }

  const band = resolveBand(total);
  const { lo, hi } = scoreRange();
  document.getElementById("colophonLeft").textContent = `${state.name} \u00b7 complete`;

  $stage.innerHTML = `
    <div class="wrap enter">
      <p class="eyebrow">${esc(state.name)}\u2019s result</p>
      <div class="card">
        <p class="score">${total}<span class="of">of ${hi}</span></p>
        <p class="band">${esc(band.title)}</p>
        <p class="band-note">${esc(band.note)}</p>
        ${structureMarkup()}
        <div class="actions">
          <div class="submitStatus" id="submitStatus" data-state="saving"><span class="dot"></span><span id="submitStatusText">Submitting your response\u2026</span></div>
          <button class="btn-ghost btn" id="btnRestart" type="button">Start over</button>
        </div>
      </div>
      <p class="fineprint" style="margin-top:16px">Scores range from ${lo} to ${hi}. This questionnaire is an indicative structural review, not financial advice.</p>
    </div>`;

  document.getElementById("btnRestart").addEventListener("click", restart);

  const res = await postToSheet({
    stage: "complete",
    sessionId: state.sessionId,
    name: state.name,
    email: state.email,
    mobile: state.mobile,
    consent: state.consent,
    total,
    band: band.title,
    answers: QUESTIONS.map(q => ({
      id: q.id, dimension: q.dimension,
      key: state.answers[q.id].key, score: state.answers[q.id].score
    })),
    source: (typeof location !== "undefined" ? location.hostname : "") || "unknown",
    clientTime: new Date().toISOString()
  });

  const statusEl = document.getElementById("submitStatus");
  const statusText = document.getElementById("submitStatusText");
  if (statusEl && statusText) {
    if (res.ok) {
      statusEl.dataset.state = "saved";
      statusText.textContent = "Response submitted";
    } else if (res.status === "offline") {
      statusEl.dataset.state = "off";
    } else {
      statusEl.dataset.state = "failed";
      statusText.textContent = res.detail ? `Couldn\u2019t submit \u2014 ${res.detail}` : "Couldn\u2019t submit. We\u2019ll still be in touch.";
    }
  }
}

function restart() {
  state.sessionId = newSessionId();
  state.name = ""; state.email = ""; state.mobile = ""; state.consent = false;
  state.answers = Object.create(null);
  state.index = 0;
  renderQuestion();
}

/* --------------------------------------------------------------------- BOOT */
function fatal(message) {
  $stage.innerHTML = `
    <div class="wrap">
      <div class="fatal">
        <h2>This questionnaire is misconfigured</h2>
        <p style="margin:0 0 12px">${esc(message)}</p>
        <p class="fineprint" style="margin:0">Fix the <code>BANDS</code> or <code>QUESTIONS</code> block in this page\u2019s source, then reload.</p>
      </div>
    </div>`;
}

(function boot() {
  document.getElementById("brandLogo").alt = CONFIG.brandName;
  try {
    assertBandIntegrity();
  } catch (err) {
    fatal(err && err.message ? err.message : String(err));
    return;
  }
  if (!CONFIG.endpoint) console.warn("[questionnaire] CONFIG.endpoint is empty \u2014 responses will not be saved.");
  if (CONFIG.sharedSecret === "CHANGE_ME_BEFORE_DEPLOY") console.warn("[questionnaire] CONFIG.sharedSecret is still the placeholder.");
  renderQuestion();
})();
</script>
